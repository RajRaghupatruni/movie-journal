name: tandem

services:
  frontend:
    build: .
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://${POSTGRES_RUNTIME_USER:-tandem_app}:${POSTGRES_RUNTIME_PASSWORD:?Set a new local POSTGRES_RUNTIME_PASSWORD in .env.local}@postgres:5432/${POSTGRES_DB:-tandem}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_MIGRATION_USER:-tandem_migrator}:${POSTGRES_MIGRATION_PASSWORD:-${POSTGRES_PASSWORD:?Set a new local POSTGRES_PASSWORD in .env.local}}@postgres:5432/${POSTGRES_DB:-tandem}
      DATABASE_RUNTIME_ROLE: ${POSTGRES_RUNTIME_USER:-tandem_app}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tandem}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-tandem_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a new local POSTGRES_PASSWORD in .env.local}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-tandem_migrator}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-${POSTGRES_PASSWORD:?Set a new local POSTGRES_PASSWORD in .env.local}}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-tandem_app}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set a new local POSTGRES_RUNTIME_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
