name: tandem-postgres-test

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tandem_test}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-tandem_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a disposable migration password}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-tandem_migrator}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-${POSTGRES_PASSWORD:?Set a disposable migration password}}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-tandem_app}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set a separate disposable runtime password}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres_test_data:
