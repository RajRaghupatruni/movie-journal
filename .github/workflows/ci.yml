name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/scan_secrets.py
      # Current checkout gate; historical compromised secrets remain a rotation incident.
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.0 dir /repo --config /repo/.gitleaks.toml --redact --no-banner

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: tandem_test
          POSTGRES_USER: tandem_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tandem_test -d tandem_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Isolated ephemeral CI database, trust auth; this is deliberately a non-secret fixture.
      DATABASE_URL: postgresql+psycopg://tandem_test:fixture@127.0.0.1:5432/tandem_test
      TEST_DATABASE_URL: postgresql+psycopg://tandem_test:fixture@127.0.0.1:5432/tandem_test
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m ruff check app tests alembic
      - run: python -m pytest
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
