name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan current source with the repository guard
        run: python scripts/scan_secrets.py
      # Current checkout gate; historical compromised secrets remain a rotation incident.
      - name: Scan current source with Gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.0 dir /repo --config /repo/.gitleaks.toml --redact --no-banner

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependency tree
        run: npm run security:deps
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:frontend
      - name: Production build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      # Non-secret interpolation fixture used only to validate the local Compose file.
      POSTGRES_DB: tandem_ci
      POSTGRES_MIGRATION_USER: tandem_migrator
      POSTGRES_PASSWORD: ci-compose-password
      POSTGRES_MIGRATION_PASSWORD: ci-migration-password
      POSTGRES_RUNTIME_USER: tandem_app
      POSTGRES_RUNTIME_PASSWORD: ci-runtime-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build --quiet

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the single production image
        run: docker build --tag tandem:ci .

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: tandem_test
          POSTGRES_USER: tandem_migrator
          POSTGRES_PASSWORD: ci-migration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tandem_migrator -d tandem_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Isolated ephemeral CI database; these are deliberately non-secret fixtures.
      DATABASE_URL: postgresql+psycopg://tandem_app:ci-runtime-password@127.0.0.1:5432/tandem_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://tandem_migrator:ci-migration-password@127.0.0.1:5432/tandem_test
      TEST_DATABASE_URL: postgresql+psycopg://tandem_app:ci-runtime-password@127.0.0.1:5432/tandem_test
      TEST_DATABASE_OWNER_URL: postgresql+psycopg://tandem_migrator:ci-migration-password@127.0.0.1:5432/tandem_test
      DATABASE_RUNTIME_ROLE: tandem_app
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock && python -m pip install --no-deps --editable .
      - name: Verify installed dependency set
        run: python -m pip check
      - name: Provision non-bypass-RLS runtime role
        run: |
          PGPASSWORD=ci-migration-password psql -h 127.0.0.1 -U tandem_migrator -d tandem_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE tandem_app LOGIN PASSWORD 'ci-runtime-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS"
      - name: Ruff lint
        run: python -m ruff check app tests alembic
      - name: Ruff format validation
        run: python -m ruff format --check app tests alembic
      - name: Upgrade migrations
        run: alembic upgrade head
      - name: Check migration drift
        run: alembic check
      - name: Verify downgrade and re-upgrade
        run: alembic downgrade base && alembic upgrade head
      - name: Backend tests
        run: python -m pytest
